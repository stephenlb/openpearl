name: Issue to PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  ISSUE_NUMBER: ${{ github.event.issue.number }}
  # Unique per attempt so re-runs never collide with (or overwrite) an earlier branch
  BRANCH: claude/issue-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
  BASE: ${{ github.event.repository.default_branch }}
  # Optional PAT lets pushes modify .github/workflows and PRs trigger CI; falls back to GITHUB_TOKEN
  GH_TOKEN: ${{ secrets.PUSH_TOKEN || github.token }}
  # Anthropic API auth (leave the secret unset when using Bedrock)
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # Bedrock auth (set CLAUDE_CODE_USE_BEDROCK=1 as a repo secret to enable)
  CLAUDE_CODE_USE_BEDROCK: ${{ secrets.CLAUDE_CODE_USE_BEDROCK }}
  AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
  ANTHROPIC_SMALL_FAST_MODEL: ${{ secrets.ANTHROPIC_SMALL_FAST_MODEL }}
  TOOLS_EDIT: "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(ls:*),Bash(npm:*),Bash(npx:*)"
  TOOLS_REVIEW: "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git status:*)"

jobs:
  implement:
    # Issue bodies are untrusted prompt input: only run for trusted authors.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Comment that processing started
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Started processing this issue. I'll post status updates here as work progresses. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Comment with task summary
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '# %s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > "$RUNNER_TEMP/task.md"
          if claude -p "Read the GitHub issue in $RUNNER_TEMP/task.md and summarize the work to be implemented in 2-4 concise markdown bullet points. Output only the bullets." \
              --allowedTools "Read($RUNNER_TEMP/task.md)" --max-turns 5 > "$RUNNER_TEMP/task-summary.md" \
              && [ -s "$RUNNER_TEMP/task-summary.md" ]; then
            :
          else
            echo "_Summary unavailable; see the issue description._" > "$RUNNER_TEMP/task-summary.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file - <<EOF
          ## Task summary

          $(cat "$RUNNER_TEMP/task-summary.md")
          EOF

      - name: Comment that implementation started
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Analyzing the issue and implementing changes..."

      - name: Implement issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Read-only token for image downloads; the push PAT is not needed here
          DL_TOKEN: ${{ github.token }}
        run: |
          # Download images attached to the issue so Claude can view them with Read
          img_dir="$RUNNER_TEMP/issue-images"
          mkdir -p "$img_dir"
          command -v file >/dev/null || { echo "'file' is required for image type detection"; exit 1; }
          n=0
          while read -r url; do
            n=$((n + 1))
            [ "$n" -le 10 ] || break
            tmp="$img_dir/download-$n"
            curl -fsSL --max-time 60 --max-filesize 10485760 -H "Authorization: Bearer $DL_TOKEN" -o "$tmp" "$url" || { echo "Could not download $url"; rm -f "$tmp"; continue; }
            if [ "$(stat -c %s "$tmp")" -gt 10485760 ]; then
              echo "Skipping $url: larger than 10 MiB"; rm -f "$tmp"; continue
            fi
            case "$(file -b --mime-type "$tmp")" in
              image/png) ext=png ;;
              image/jpeg) ext=jpg ;;
              image/gif) ext=gif ;;
              image/webp) ext=webp ;;
              *) echo "Skipping $url: not a supported image"; rm -f "$tmp"; continue ;;
            esac
            mv "$tmp" "$img_dir/image-$n.$ext"
          done < <(printf '%s' "$ISSUE_BODY" \
            | grep -oE 'https://(github\.com/user-attachments/assets/|user-images\.githubusercontent\.com/|private-user-images\.githubusercontent\.com/)[^")> ]+' \
            | sort -u)
          {
            echo "You are implementing GitHub issue #$ISSUE_NUMBER in this repository."
            echo "Modify the codebase to resolve it. Follow existing conventions, add or update tests where appropriate."
            echo "Do not run git commit or git push; that is handled for you."
            echo
            echo "# $ISSUE_TITLE"
            echo
            echo "$ISSUE_BODY"
            images=$(ls "$img_dir")
            if [ -n "$images" ]; then
              echo
              echo "# Attached images"
              echo "The issue references images, downloaded to the files below. Use Read to view them."
              for f in $images; do echo "- $img_dir/$f"; done
            fi
          } > "$RUNNER_TEMP/prompt.md"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --permission-mode acceptEdits \
            --allowedTools "$TOOLS_EDIT,Read($RUNNER_TEMP/issue-images/**)" \
            --max-turns 60

      - name: Commit and push
        id: commit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Resolve #$ISSUE_NUMBER: $ISSUE_TITLE"
          git push -u origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment that changes were pushed
        if: steps.commit.outputs.changed == 'true'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Implementation complete; changes pushed to branch \`$BRANCH\`. Opening a PR..."

      - name: Comment that no changes were made
        if: steps.commit.outputs.changed == 'false'
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Claude ran but made no changes, so no PR was opened. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

      - name: Open PR
        if: steps.commit.outputs.changed == 'true'
        id: pr
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          url=$(gh pr create \
            --base "$BASE" --head "$BRANCH" \
            --title "$ISSUE_TITLE" \
            --body "Closes #$ISSUE_NUMBER")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --body "Opened PR $url. Starting automated code review (2 rounds)..."

      - name: Review and fix (2 rounds)
        if: steps.commit.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for round in 1 2; do
            echo "::group::Review round $round"
            claude -p "Code review the changes on this branch: run 'git diff origin/$BASE...HEAD'. Look for correctness bugs, missing tests, security issues, and clear maintainability problems. Output a concise markdown list of concrete findings with file and line, most severe first. If there is nothing worth fixing, output exactly: NO ISSUES" \
              --allowedTools "$TOOLS_REVIEW" > "$RUNNER_TEMP/review-$round.md"
            cat "$RUNNER_TEMP/review-$round.md"
            echo "::endgroup::"

            gh pr comment "$PR_NUMBER" --body-file - <<EOF
          ## Code review (round $round)

          $(cat "$RUNNER_TEMP/review-$round.md")
          EOF

            if grep -qx "NO ISSUES" "$RUNNER_TEMP/review-$round.md"; then
              gh issue comment "$ISSUE_NUMBER" --body "Code review round $round: no issues found."
              continue
            fi

            gh issue comment "$ISSUE_NUMBER" --body "Code review round $round found issues; applying fixes..."

            echo "::group::Fix round $round"
            claude -p "Apply fixes for the findings in $RUNNER_TEMP/review-$round.md to this codebase. Skip any finding that is incorrect. Do not run git commit or git push." \
              --permission-mode acceptEdits \
              --allowedTools "$TOOLS_EDIT,Read($RUNNER_TEMP/**)" \
              --max-turns 40
            echo "::endgroup::"

            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Address code review feedback (round $round)"
              git push
            fi
          done

      - name: Summarize completed work
        if: steps.commit.outputs.changed == 'true'
        run: |
          if claude -p "Run 'git diff origin/$BASE...HEAD' and summarize the work completed in 3-6 concise markdown bullet points. Output only the bullets." \
              --allowedTools "$TOOLS_REVIEW" --max-turns 10 > "$RUNNER_TEMP/done-summary.md" \
              && [ -s "$RUNNER_TEMP/done-summary.md" ]; then
            :
          else
            echo "_Summary unavailable; see the PR for details._" > "$RUNNER_TEMP/done-summary.md"
          fi

      - name: Eval - PR ready to auto-merge
        if: steps.commit.outputs.changed == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Running final eval to decide whether PR $PR_URL is safe to auto-merge..."
          printf '# %s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"

          # Final review-only pass so the round-2 fixes are also reviewed
          claude -p "Code review the changes on this branch: run 'git diff origin/$BASE...HEAD'. Look for correctness bugs, security issues, and clear maintainability problems. Output a concise markdown list of concrete findings with file and line, most severe first. If there is nothing worth fixing, output exactly: NO ISSUES" \
            --allowedTools "$TOOLS_REVIEW" > "$RUNNER_TEMP/review-3.md" || echo "Final review failed" > "$RUNNER_TEMP/review-3.md"
          final_clean=false
          grep -qx "NO ISSUES" "$RUNNER_TEMP/review-3.md" && final_clean=true

          # Deterministic guard: never auto-merge changes to workflows
          protected=$(git diff --name-only "origin/$BASE...HEAD" | grep -E '^\.github/' || true)

          verdict=NO
          if [ -n "$protected" ]; then
            printf 'Auto-merge blocked: diff touches protected paths:\n%s\n' "$protected" > "$RUNNER_TEMP/eval.md"
          elif [ "$final_clean" != "true" ]; then
            echo "Auto-merge blocked: final review did not report NO ISSUES" > "$RUNNER_TEMP/eval.md"
          elif claude -p "$(cat .github/workflows/evals/pr-ready-to-merge.md)

          Base branch: origin/$BASE
          Issue file: $RUNNER_TEMP/issue.md
          Review files: $RUNNER_TEMP/review-1.md, $RUNNER_TEMP/review-2.md, $RUNNER_TEMP/review-3.md (review-3 is the final review of the fixed code and takes precedence)" \
            --allowedTools "$TOOLS_REVIEW,Read($RUNNER_TEMP/**)" \
            --max-turns 20 > "$RUNNER_TEMP/eval.md"; then
            # Fail closed: only a final line of exactly YES (surrounding whitespace ignored) merges
            last=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/eval.md" | tail -n 1 | tr -d '[:space:]')
            [ "$last" = "YES" ] && verdict=YES
          else
            echo "Eval command failed" > "$RUNNER_TEMP/eval.md"
          fi
          cat "$RUNNER_TEMP/eval.md"

          gh pr comment "$PR_NUMBER" --body-file - <<EOF
          ## Auto-merge eval

          $(cat "$RUNNER_TEMP/eval.md")
          EOF

          if [ "$verdict" = "YES" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Auto-merge eval: YES. Waiting for CI on $PR_URL..."
            if gh pr checks "$PR_NUMBER" --watch --fail-fast \
              && gh pr merge "$PR_NUMBER" --squash --delete-branch; then
              gh issue comment "$ISSUE_NUMBER" --body "PR Auto-Merged: $PR_URL"
            else
              gh issue comment "$ISSUE_NUMBER" --body "Auto-merge failed (checks failing/missing or merge blocked). PR Ready for Review: $PR_URL"
            fi
          else
            gh issue comment "$ISSUE_NUMBER" --body "Auto-merge eval: NO. PR Ready for Review: $PR_URL"
          fi

      - name: Comment with summary of work completed
        if: steps.commit.outputs.changed == 'true' && !cancelled()
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file - <<EOF
          ## Summary of work completed

          $(cat "$RUNNER_TEMP/done-summary.md")
          EOF

      - name: Report failure
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "The automated workflow failed. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
